[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khaslana"
version = "0.1.0"
description = "A production-grade, local-first AI developer tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Khaslana Contributors" }]
keywords = ["ai", "developer-tools", "code-assistant", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "toml>=0.10.0",
    "tenacity>=8.0.0",
    "structlog>=23.0.0",
    "gitpython>=3.1.0",
    "docker>=7.0.0",
    "watchdog>=4.0.0",
    "pathspec>=0.11.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "respx>=0.20.0",
]

[project.scripts]
khaslana = "khaslana.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/khaslana"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyrefly]
search-path = ["src", "."]
