name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install ruff mypy pytest pytest-cov pytest-asyncio respx syrupy textual-snapshot

      - name: Run Ruff Linter
        run: ruff check src tests benchmarks

      - name: Run Ruff Formatter Check
        run: ruff format --check src tests benchmarks

      - name: Run Mypy Type Checker
        run: mypy src

      - name: Run Pytest Test Suite
        run: pytest -m "not docker and not ollama and not network" --cov=khaslana --cov-report=xml --cov-report=term
